<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Izzeenity — Донат</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
	--bg:#0c0710;
	--panel:#150c1a;
	--panel-2:#1d1223;
	--line:#301c39;
	--pink:#ff3d81;
	--pink-dim:#7a2148;
	--pink-glow:rgba(255,61,129,.35);
	--text:#f0e9f4;
	--text-dim:#9a8aa8;
	--danger:#ff5c5c;
	--success:#5cffb0;
	--radius:16px;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{
	width:100%;height:100%;
	background:transparent;
	font-family:'Rajdhani',sans-serif;
	color:var(--text);
	overflow:hidden;
	user-select:none;
}

.hidden{display:none !important;}

#app{
	position:absolute;
	inset:6% 8%;
	background:
		radial-gradient(1000px 460px at 90% -10%, rgba(255,61,129,.10), transparent 60%),
		linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%);
	border:1px solid var(--line);
	border-radius:var(--radius);
	box-shadow:0 30px 90px rgba(0,0,0,.65);
	display:flex;
	flex-direction:column;
	overflow:hidden;
}

/* ---------- topbar ---------- */

.topbar{
	display:flex;
	align-items:center;
	gap:20px;
	padding:18px 26px;
	border-bottom:1px solid var(--line);
	background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
	flex-shrink:0;
}

.brand{
	display:flex;
	align-items:center;
	gap:10px;
	flex-shrink:0;
}

.brand-mark{
	width:36px;height:36px;
	display:flex;align-items:center;justify-content:center;
	background:linear-gradient(135deg, var(--pink), #ff8fbf);
	color:#1a0410;
	font-weight:700;
	font-size:15px;
	border-radius:10px;
	letter-spacing:.5px;
	box-shadow:0 6px 18px var(--pink-glow);
}

.brand-text{
	font-weight:700;
	font-size:17px;
	letter-spacing:2px;
	color:var(--text);
}
.brand-text-accent{color:var(--pink);}

.balance{
	display:flex;
	align-items:baseline;
	gap:6px;
	padding:8px 16px;
	background:var(--panel-2);
	border:1px solid var(--line);
	border-radius:10px;
	margin-left:auto;
	flex-shrink:0;
}

.balance-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-right:4px;}
.balance-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;color:var(--pink);}
.balance-currency{font-size:12px;color:var(--text-dim);}

.close-btn{
	appearance:none;border:1px solid var(--line);background:var(--panel-2);
	color:var(--text-dim);width:36px;height:36px;border-radius:10px;
	font-size:15px;cursor:pointer;flex-shrink:0;transition:all .15s ease;
}
.close-btn:hover{color:var(--danger);border-color:var(--danger);}

/* ---------- body: sidebar + content ---------- */

.body{
	flex:1;
	display:flex;
	min-height:0;
}

/* ---------- left sidebar tabs ---------- */

.tabs{
	position:relative;
	width:210px;
	flex-shrink:0;
	display:flex;
	flex-direction:column;
	gap:2px;
	padding:16px 12px;
	border-right:1px solid var(--line);
	background:linear-gradient(180deg, rgba(255,61,129,.04), transparent 40%);
	overflow-y:auto;
}

.tab-indicator{
	position:absolute;
	left:12px;right:12px;
	top:16px;
	height:0;
	background:linear-gradient(135deg, var(--pink), #d6207a);
	border-radius:10px;
	box-shadow:0 6px 20px var(--pink-glow);
	transition:transform .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1);
	z-index:0;
}

.tab{
	position:relative;
	z-index:1;
	appearance:none;
	border:none;
	background:transparent;
	color:var(--text-dim);
	font-family:inherit;
	font-weight:600;
	font-size:15px;
	letter-spacing:.3px;
	padding:12px 14px;
	border-radius:10px;
	cursor:pointer;
	text-align:left;
	display:flex;
	align-items:center;
	gap:10px;
	transition:color .2s ease;
}

.tab svg{
	width:18px;height:18px;
	flex-shrink:0;
	transition:transform .2s ease;
}

.tab:hover{color:var(--text);}
.tab:hover svg{transform:scale(1.1);}

.tab.active{color:#1a0410;}
.tab.active svg{stroke:#1a0410;}

/* ---------- content / grid ---------- */

.content{
	flex:1;
	display:flex;
	flex-direction:column;
	min-width:0;
}

.grid{
	flex:1;
	overflow-y:auto;
	padding:24px;
	display:grid;
	grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
	gap:16px;
	align-content:start;
}

.grid::-webkit-scrollbar,.tabs::-webkit-scrollbar{width:8px;}
.grid::-webkit-scrollbar-thumb,.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

.card{
	background:var(--panel-2);
	border:1px solid var(--line);
	border-radius:12px;
	overflow:hidden;
	cursor:pointer;
	transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
	display:flex;
	flex-direction:column;
}

.card:hover{
	transform:translateY(-3px);
	border-color:var(--pink-dim);
	box-shadow:0 14px 34px rgba(0,0,0,.45);
}

.card-image{
	width:100%;
	aspect-ratio:16/10;
	background:#0f0813;
	background-size:cover;
	background-position:center;
	position:relative;
	flex-shrink:0;
}

.card-image::after{
	content:"";
	position:absolute;inset:0;
	background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,.55));
}

.card-noimage{
	width:100%;
	aspect-ratio:16/10;
	background:
		repeating-linear-gradient(135deg, rgba(255,61,129,.06) 0 10px, transparent 10px 20px),
		#0f0813;
	display:flex;align-items:center;justify-content:center;
	flex-shrink:0;
}
.card-noimage span{font-size:26px;color:var(--pink-dim);}

.card-body{
	padding:12px 14px 14px;
	display:flex;
	flex-direction:column;
	gap:6px;
}

.card-name{
	font-weight:600;
	font-size:16px;
	line-height:1.2;
}

.card-price{
	font-family:'JetBrains Mono',monospace;
	font-weight:700;
	font-size:14px;
	color:var(--pink);
}

.empty-state{
	flex:1;
	display:flex;align-items:center;justify-content:center;
	color:var(--text-dim);
	font-size:16px;
}

/* ---------- modal ---------- */

.modal-overlay{
	position:absolute;inset:0;
	background:rgba(0,0,0,.6);
	backdrop-filter:blur(4px);
	display:flex;align-items:center;justify-content:center;
	z-index:20;
}

.modal{
	width:440px;
	max-width:90%;
	background:var(--panel);
	border:1px solid var(--line);
	border-radius:var(--radius);
	overflow:hidden;
	box-shadow:0 30px 80px rgba(0,0,0,.6);
	position:relative;
}

.modal-close{
	position:absolute;top:12px;right:12px;z-index:2;
	appearance:none;border:1px solid var(--line);background:rgba(12,7,16,.7);
	color:var(--text-dim);width:32px;height:32px;border-radius:8px;
	font-size:14px;cursor:pointer;
}
.modal-close:hover{color:var(--danger);border-color:var(--danger);}

.modal-image-wrap{
	width:100%;aspect-ratio:16/9;
	background:#0f0813;
}
.modal-image{width:100%;height:100%;object-fit:cover;display:block;}

.modal-body{padding:22px 24px 24px;}

.modal-body h2{font-size:22px;font-weight:700;margin-bottom:8px;}

.modal-desc{
	font-size:14px;
	line-height:1.5;
	color:var(--text-dim);
	white-space:pre-line;
	margin-bottom:14px;
}

.modal-input-wrap{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.modal-input-wrap label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}

.modal-input-wrap input{
	background:var(--panel-2);
	border:1px solid var(--line);
	color:var(--text);
	font-family:'JetBrains Mono',monospace;
	font-size:15px;
	padding:10px 12px;
	border-radius:8px;
	outline:none;
	transition:border-color .15s ease;
}
.modal-input-wrap input:focus{border-color:var(--pink);}

.modal-input-hint{font-size:12px;color:var(--text-dim);}
.modal-input-hint.invalid{color:var(--danger);}

.modal-footer{
	display:flex;align-items:center;justify-content:space-between;
	padding-top:6px;
}

.modal-price{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--pink);}

.btn-buy{
	appearance:none;border:none;
	background:linear-gradient(135deg, var(--pink), #d6207a);
	color:#1a0410;
	font-family:'Rajdhani',sans-serif;
	font-weight:700;
	font-size:15px;
	letter-spacing:.5px;
	padding:11px 26px;
	border-radius:9px;
	cursor:pointer;
	transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn-buy:hover:not(:disabled){box-shadow:0 8px 22px var(--pink-glow);transform:translateY(-1px);}
.btn-buy:disabled{opacity:.4;cursor:not-allowed;}

.modal-message{
	margin-top:12px;
	font-size:13px;
	min-height:16px;
}
.modal-message.error{color:var(--danger);}
.modal-message.success{color:var(--success);}

/* ---------- toast ---------- */

.toast{
	position:absolute;
	bottom:28px;left:50%;
	transform:translateX(-50%);
	background:var(--panel-2);
	border:1px solid var(--line);
	padding:12px 22px;
	border-radius:10px;
	font-size:14px;
	font-weight:600;
	box-shadow:0 12px 30px rgba(0,0,0,.4);
	z-index:30;
}
.toast.error{border-color:var(--danger);color:var(--danger);}
.toast.success{border-color:var(--success);color:var(--success);}

</style>
</head>
<body>

<div id="app" class="hidden">

	<header class="topbar">
		<div class="brand">
			<span class="brand-mark">IZ</span>
			<span class="brand-text">DONATE<span class="brand-text-accent">SHOP</span></span>
		</div>

		<div class="balance">
			<span class="balance-label">Баланс</span>
			<span class="balance-value" id="balance">0</span>
			<span class="balance-currency">Coins</span>
		</div>

		<button class="close-btn" id="closeBtn" title="Закрыть">✕</button>
	</header>

	<div class="body">
		<nav class="tabs" id="tabs">
			<div class="tab-indicator" id="tabIndicator"></div>
		</nav>

		<main class="content">
			<div class="grid" id="grid"></div>
			<p class="empty-state hidden" id="emptyState">В этой категории пока нет товаров</p>
		</main>
	</div>

</div>

<!-- модалка подтверждения -->
<div id="modalOverlay" class="modal-overlay hidden">
	<div class="modal">
		<button class="modal-close" id="modalClose">✕</button>

		<div class="modal-image-wrap" id="modalImageWrap">
			<img id="modalImage" class="modal-image" src="" alt="">
		</div>

		<div class="modal-body">
			<h2 id="modalName">—</h2>
			<p class="modal-desc" id="modalDesc"></p>

			<div class="modal-input-wrap hidden" id="modalInputWrap">
				<label id="modalInputLabel" for="modalInput">Введите значение</label>
				<input type="text" id="modalInput" maxlength="24" autocomplete="off" spellcheck="false">
				<span class="modal-input-hint" id="modalInputHint"></span>
			</div>

			<div class="modal-footer">
				<span class="modal-price"><span id="modalPrice">0</span> Coins</span>
				<button class="btn-buy" id="modalBuyBtn">Купить</button>
			</div>

			<p class="modal-message" id="modalMessage"></p>
		</div>
	</div>
</div>

<!-- всплывающие уведомления (результат покупки) -->
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* -------------------------------------------------------------------------
   Мини-заглушка cef, чтобы страницу можно было открыть в обычном браузере
   для верстки/отладки. В игре объект cef подставляет сам плагин samp-cef,
   и этот блок просто не используется.
-------------------------------------------------------------------------- */
if (typeof window.cef === "undefined") {
	console.warn("[donate] cef не найден — включена заглушка для превью в браузере");

	const fakeCatalog = {
		balance: 1250,
		categories: [
			{ id: "transport", name: "Транспорт" },
			{ id: "skin", name: "Скины" },
			{ id: "accessory", name: "Аксессуары" },
			{ id: "other", name: "Прочее" }
		],
		items: [
			{ id: 0, category: "transport", name: "Audi A8", price: 500,
			  image: "img/cars/audi_a8.jpg",
			  desc: "Гос. цена: 2 000 000 $\nТип топлива: АИ-92\n\nПри покупке выдаётся талон активации — используйте его из инвентаря, машина появится в /cars." },
			{ id: 1, category: "other", name: "Смена ника", price: 50,
			  requires_input: true, input_label: "Новый ник (Имя_Фамилия)",
			  input_pattern: "^[A-ZА-Я][a-zа-я]+_[A-ZА-Я][a-zа-я]+$",
			  input_hint: "Формат: Имя_Фамилия, с заглавных букв",
			  desc: "Смена игрового ник-нейма персонажа." }
		]
	};

	window.cef = {
		emit(event, ...args) {
			console.log("[donate:preview] emit ->", event, args);
			if (event === "donate:ready") {
				window.cef.trigger("donate:init", JSON.stringify(fakeCatalog));
			}
			if (event === "donate:buy") {
				setTimeout(() => {
					window.cef.trigger("donate:result", JSON.stringify({
						success: true,
						item_id: Number(args[0]),
						message: "Покупка успешна (превью)",
						balance: 999
					}));
				}, 400);
			}
		},
		on(event, cb) {
			(window.cef._h = window.cef._h || {})[event] = cb;
		},
		trigger(event, ...args) {
			if (window.cef._h && window.cef._h[event]) window.cef._h[event](...args);
		},
		set_focus() {}
	};
}

/* ------------------------------------------------------------------------- */

const state = {
	balance: 0,
	categories: [],
	items: [],
	activeCategory: null,
	activeItem: null,
	pending: false
};

const el = {
	app: document.getElementById("app"),
	tabs: document.getElementById("tabs"),
	tabIndicator: document.getElementById("tabIndicator"),
	grid: document.getElementById("grid"),
	emptyState: document.getElementById("emptyState"),
	balance: document.getElementById("balance"),
	closeBtn: document.getElementById("closeBtn"),

	modalOverlay: document.getElementById("modalOverlay"),
	modalClose: document.getElementById("modalClose"),
	modalImageWrap: document.getElementById("modalImageWrap"),
	modalImage: document.getElementById("modalImage"),
	modalName: document.getElementById("modalName"),
	modalDesc: document.getElementById("modalDesc"),
	modalInputWrap: document.getElementById("modalInputWrap"),
	modalInputLabel: document.getElementById("modalInputLabel"),
	modalInput: document.getElementById("modalInput"),
	modalInputHint: document.getElementById("modalInputHint"),
	modalPrice: document.getElementById("modalPrice"),
	modalBuyBtn: document.getElementById("modalBuyBtn"),
	modalMessage: document.getElementById("modalMessage"),

	toast: document.getElementById("toast")
};

/* ---------------------------- инициализация ---------------------------- */

cef.on("donate:init", (payload) => {
	const data = JSON.parse(payload);

	state.balance = data.balance;
	state.categories = data.categories;
	state.items = data.items;
	state.activeCategory = data.categories.length ? data.categories[0].id : null;

	renderTabs();
	renderGrid();
	updateBalance(state.balance);

	el.app.classList.remove("hidden");
});

cef.on("donate:result", (payload) => {
	const res = JSON.parse(payload);

	state.pending = false;
	updateBalance(res.balance);

	if (state.activeItem && state.activeItem.id === res.item_id) {
		if (res.success) {
			showModalMessage(res.message || "Покупка успешна", "success");
			el.modalBuyBtn.disabled = false;
			setTimeout(closeModal, 900);
		} else {
			showModalMessage(res.message || "Не удалось совершить покупку", "error");
			el.modalBuyBtn.disabled = false;
			el.modalBuyBtn.textContent = "Купить";
		}
	} else {
		showToast(res.message || (res.success ? "Готово" : "Ошибка"), res.success ? "success" : "error");
	}
});

cef.emit("donate:ready");

/* -------------------------------- рендер -------------------------------- */

const TAB_ICONS = {
	transport: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.6-4.8A2 2 0 0 1 6.5 7h11a2 2 0 0 1 1.9 1.2L21 13"/><path d="M3 13h18v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>',
	skin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l4 2 4-2 4 4-3 3v9a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-9L4 8z"/></svg>',
	accessory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.7 6.2.6-4.7 4.2 1.4 6.1L12 16.8l-5.5 2.8 1.4-6.1-4.7-4.2 6.2-.6z"/></svg>',
	other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-7.6 7.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L12 4h6a2 2 0 0 1 2 2z"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/></svg>'
};

function renderTabs() {
	el.tabs.querySelectorAll(".tab").forEach((t) => t.remove());

	state.categories.forEach((cat) => {
		const btn = document.createElement("button");
		btn.className = "tab" + (cat.id === state.activeCategory ? " active" : "");
		btn.dataset.id = cat.id;
		btn.innerHTML = (TAB_ICONS[cat.id] || "") + `<span>${escapeHtml(cat.name)}</span>`;
		btn.addEventListener("click", () => {
			state.activeCategory = cat.id;
			renderTabs();
			renderGrid();
		});
		el.tabs.appendChild(btn);
	});

	requestAnimationFrame(positionTabIndicator);
}

function positionTabIndicator() {
	const active = el.tabs.querySelector(".tab.active");
	if (!active) return;

	el.tabIndicator.style.height = active.offsetHeight + "px";
	el.tabIndicator.style.transform = `translateY(${active.offsetTop - 16}px)`;
}

window.addEventListener("resize", positionTabIndicator);

function renderGrid() {
	el.grid.innerHTML = "";

	const items = state.items.filter((i) => i.category === state.activeCategory);

	el.emptyState.classList.toggle("hidden", items.length > 0);
	el.grid.classList.toggle("hidden", items.length === 0);

	items.forEach((item) => {
		const card = document.createElement("div");
		card.className = "card";
		card.addEventListener("click", () => openModal(item));

		if (item.image) {
			const img = document.createElement("div");
			img.className = "card-image";
			img.style.backgroundImage = `url("${item.image}")`;
			card.appendChild(img);
		} else {
			const ph = document.createElement("div");
			ph.className = "card-noimage";
			ph.innerHTML = "<span>—</span>";
			card.appendChild(ph);
		}

		const body = document.createElement("div");
		body.className = "card-body";
		body.innerHTML = `
			<div class="card-name">${escapeHtml(item.name)}</div>
			<div class="card-price">${item.price} Coins</div>
		`;
		card.appendChild(body);

		el.grid.appendChild(card);
	});
}

function updateBalance(value) {
	if (typeof value === "number") state.balance = value;
	el.balance.textContent = state.balance;
}

/* -------------------------------- модалка -------------------------------- */

function openModal(item) {
	state.activeItem = item;

	el.modalName.textContent = item.name;
	el.modalDesc.textContent = item.desc || "";
	el.modalPrice.textContent = item.price;
	el.modalMessage.textContent = "";
	el.modalMessage.className = "modal-message";

	if (item.image) {
		el.modalImageWrap.classList.remove("hidden");
		el.modalImage.src = item.image;
	} else {
		el.modalImageWrap.classList.add("hidden");
	}

	if (item.requires_input) {
		el.modalInputWrap.classList.remove("hidden");
		el.modalInputLabel.textContent = item.input_label || "Введите значение";
		el.modalInputHint.textContent = item.input_hint || "";
		el.modalInputHint.className = "modal-input-hint";
		el.modalInput.value = "";
		validateInput();
	} else {
		el.modalInputWrap.classList.add("hidden");
		el.modalBuyBtn.disabled = false;
	}

	el.modalBuyBtn.textContent = "Купить";
	el.modalOverlay.classList.remove("hidden");

	if (item.requires_input) el.modalInput.focus();
}

function closeModal() {
	el.modalOverlay.classList.add("hidden");
	state.activeItem = null;
}

function validateInput() {
	const item = state.activeItem;
	if (!item || !item.requires_input) return;

	const value = el.modalInput.value.trim();
	let ok = value.length > 0;

	if (ok && item.input_pattern) {
		try { ok = new RegExp(item.input_pattern).test(value); }
		catch (e) { /* некорректный паттерн - пропускаем regex-проверку */ }
	}

	el.modalBuyBtn.disabled = !ok;
	el.modalInputHint.classList.toggle("invalid", value.length > 0 && !ok);
}

el.modalInput.addEventListener("input", validateInput);

el.modalBuyBtn.addEventListener("click", () => {
	if (state.pending || !state.activeItem) return;

	const item = state.activeItem;
	const inputValue = item.requires_input ? el.modalInput.value.trim() : "-";

	state.pending = true;
	el.modalBuyBtn.disabled = true;
	el.modalBuyBtn.textContent = "Покупка...";
	el.modalMessage.textContent = "";

	cef.emit("donate:buy", item.id, inputValue || "-");
});

el.modalClose.addEventListener("click", closeModal);
el.modalOverlay.addEventListener("click", (e) => {
	if (e.target === el.modalOverlay) closeModal();
});

document.addEventListener("keydown", (e) => {
	if (e.key === "Escape") {
		if (!el.modalOverlay.classList.contains("hidden")) closeModal();
		else requestClose();
	}
});

/* -------------------------------- закрытие -------------------------------- */

function requestClose() {
	cef.emit("donate:close");
	cef.set_focus(false);
}

el.closeBtn.addEventListener("click", requestClose);

/* -------------------------------- утилиты -------------------------------- */

function showModalMessage(text, type) {
	el.modalMessage.textContent = text;
	el.modalMessage.className = "modal-message " + type;
}

function showToast(text, type) {
	el.toast.textContent = text;
	el.toast.className = "toast " + type;
	el.toast.classList.remove("hidden");
	clearTimeout(showToast._t);
	showToast._t = setTimeout(() => el.toast.classList.add("hidden"), 2500);
}

function escapeHtml(str) {
	const d = document.createElement("div");
	d.textContent = str;
	return d.innerHTML;
}

</script>
</body>
</html>
