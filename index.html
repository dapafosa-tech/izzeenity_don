<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IZZEENITY — Донат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c12; --bg-soft: #0e1119; --panel: #12151f; --card: #161a26; --card-hover: #1c2130;
    --border: rgba(255,255,255,0.07); --border-soft: rgba(255,255,255,0.04);
    --text: #eef0f6; --text-muted: #8890a4; --text-dim: #5c6478;
    --violet: #9b6bff; --violet-soft: rgba(155,107,255,0.14);
    --amber: #f5b942; --amber-soft: rgba(245,185,66,0.14);
    --cyan: #4fd6d0; --danger: #ff5470; --danger-soft: rgba(255,84,112,0.14);
    --radius: 14px; --radius-sm: 9px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; background:transparent; font-family:'Manrope', sans-serif; color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; }
  ::selection{ background:var(--violet); color:#fff; }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:#2a2f3f; border-radius:8px; }
  *::-webkit-scrollbar-thumb:hover{ background:#383f54; }
  #backdrop{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 20%, rgba(120,80,220,0.10), transparent 60%), rgba(3,4,7,0.55);
    backdrop-filter: blur(6px); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:10;
  }
  #backdrop.visible{ opacity:1; pointer-events:auto; }
  #shell{
    position:relative; width:min(1040px, 94vw); height:min(660px, 88vh);
    background:linear-gradient(180deg, var(--panel), var(--bg));
    border:1px solid var(--border); border-radius:20px;
    box-shadow:0 30px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(18px) scale(.985); opacity:0;
    transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s ease;
  }
  #backdrop.visible #shell{ transform:translateY(0) scale(1); opacity:1; }
  #shell::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay; z-index:5;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; padding:18px 24px;
    border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent); flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .logo{
    font-family:'Bebas Neue', sans-serif; font-size:30px; letter-spacing:2px; color:#fff;
    text-shadow:0 0 12px rgba(155,107,255,0.65), 0 0 30px rgba(155,107,255,0.25);
    animation:flicker 6s infinite;
  }
  .brand .logo span{ color:var(--violet); }
  .brand .tag{ font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--text-dim); font-weight:700; }
  @keyframes flicker{ 0%,19%,21%,23%,80%,100%{ opacity:1; } 20%,22%{ opacity:.72; } }
  .header-right{ display:flex; align-items:center; gap:14px; }
  .balance{
    display:flex; align-items:center; gap:8px; background:var(--amber-soft);
    border:1px solid rgba(245,185,66,0.3); padding:8px 14px; border-radius:999px;
  }
  .balance .coin{
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe9b0, var(--amber) 60%, #b9822a);
    box-shadow:0 0 8px rgba(245,185,66,0.6); flex-shrink:0;
  }
  .balance b{ font-size:15px; font-weight:800; color:#ffd98a; letter-spacing:.3px; }
  .balance span{ font-size:11px; color:var(--text-dim); margin-left:2px; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; transition:.15s;
  }
  .icon-btn:hover{ background:var(--danger-soft); border-color:rgba(255,84,112,.4); color:#ff8fa3; }
  .body{ flex:1; display:flex; min-height:0; }
  nav.categories{
    width:190px; flex-shrink:0; border-right:1px solid var(--border-soft);
    padding:16px 12px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;
  }
  .cat-btn{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-sm);
    color:var(--text-muted); font-size:13.5px; font-weight:700; cursor:pointer;
    border:1px solid transparent; transition:.15s; letter-spacing:.2px;
  }
  .cat-btn .ic{ width:17px; height:17px; flex-shrink:0; opacity:.8; }
  .cat-btn:hover{ background:rgba(255,255,255,0.035); color:var(--text); }
  .cat-btn.active{ background:var(--violet-soft); border-color:rgba(155,107,255,0.35); color:#d7c6ff; }
  .cat-btn.active .ic{ opacity:1; }
  .cat-count{
    margin-left:auto; font-size:10.5px; font-weight:800; color:var(--text-dim);
    background:rgba(255,255,255,0.05); padding:1px 7px; border-radius:999px;
  }
  .cat-btn.active .cat-count{ color:#d7c6ff; background:rgba(155,107,255,0.22); }
  main.content{ flex:1; min-width:0; display:flex; flex-direction:column; padding:18px 22px; overflow:hidden; }
  .content-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-shrink:0; }
  .content-title{ font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:1px; color:#fff; }
  .content-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; font-weight:600; }
  .search{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.035);
    border:1px solid var(--border); border-radius:10px; padding:8px 12px; width:220px;
  }
  .search input{ background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%; font-family:'Manrope', sans-serif; }
  .search input::placeholder{ color:var(--text-dim); }
  .search svg{ flex-shrink:0; opacity:.55; }
  .scroll-area{ flex:1; overflow-y:auto; padding-right:4px; padding-bottom:6px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .card{
    position:relative; background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; transition:.18s ease; cursor:default;
  }
  .card:hover{ background:var(--card-hover); border-color:rgba(155,107,255,0.28); transform:translateY(-2px); }
  .card .thumb{ width:100%; aspect-ratio:4/2.7; background:#0d0f17; position:relative; overflow:hidden; }
  .card .thumb img{ width:100%; height:100%; object-fit:contain; object-position:center; display:block; transition:transform .3s ease; background:#0d0f17; }
  .card:hover .thumb img{ transform:scale(1.05); }
  .card .thumb .fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue', sans-serif; font-size:15px; letter-spacing:1px; color:var(--text-dim);
    background:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 10px, transparent 10px 20px), linear-gradient(160deg, #171b28, #0c0e15);
    text-align:center; padding:10px;
  }
  .badge{
    position:absolute; top:8px; left:8px; background:rgba(10,12,18,0.75);
    border:1px solid rgba(255,255,255,0.12); color:var(--cyan);
    font-size:10px; font-weight:800; letter-spacing:.4px; padding:3px 8px; border-radius:999px; backdrop-filter:blur(3px);
  }
  .card .info{ padding:12px 12px 13px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card .name{ font-size:14px; font-weight:800; color:var(--text); line-height:1.25; }
  .card .desc{ font-size:11.5px; color:var(--text-dim); line-height:1.45; white-space:pre-line; }
  .card .row{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px; flex-wrap:wrap; }
  .price{ display:flex; align-items:center; gap:6px; font-family:'Bebas Neue', sans-serif; font-size:17px; color:#ffd98a; letter-spacing:.5px; }
  .price .coin{ width:14px; height:14px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9b0, var(--amber) 60%, #b9822a); flex-shrink:0; }
  .buy-btn{
    background:linear-gradient(180deg, #a97bff, #8455f0); color:#fff; border:none; border-radius:9px;
    padding:8px 14px; font-size:12.5px; font-weight:800; letter-spacing:.3px; cursor:pointer;
    box-shadow:0 4px 14px rgba(139,85,240,0.35); transition:.15s; white-space:nowrap;
  }
  .buy-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .buy-btn:active{ transform:translateY(0); }
  .buy-btn[disabled]{ opacity:.5; cursor:not-allowed; filter:none; transform:none; }
  .try-btn{
    background:#2a2f3f; color:var(--text-muted); border:1px solid var(--border); border-radius:9px;
    padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .try-btn:hover{ color:#fff; border-color:rgba(155,107,255,.4); }
  .list{ display:flex; flex-direction:column; gap:10px; }
  .row-item{
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:13px 16px; transition:.15s;
  }
  .row-item:hover{ background:var(--card-hover); border-color:rgba(155,107,255,0.28); }
  .row-item .ic-wrap{
    width:42px; height:42px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--violet-soft); color:#c8b3ff;
  }
  .row-item .body-txt{ flex:1; min-width:0; }
  .row-item .name{ font-size:14px; font-weight:800; }
  .row-item .desc{ font-size:11.5px; color:var(--text-dim); margin-top:2px; white-space:pre-line; }
  .row-item .row-right{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:var(--text-dim); gap:8px; text-align:center;
  }
  .empty b{ color:var(--text-muted); font-size:13px; }
  #confirm-layer{
    position:absolute; inset:0; background:rgba(4,5,9,0.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none;
    transition:opacity .18s ease; z-index:20;
  }
  #confirm-layer.visible{ opacity:1; pointer-events:auto; }
  .confirm-box{
    width:360px; background:linear-gradient(180deg, #161a26, #0f121b); border:1px solid var(--border);
    border-radius:16px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.5);
    transform:scale(.96) translateY(6px); transition:transform .18s ease;
  }
  #confirm-layer.visible .confirm-box{ transform:scale(1) translateY(0); }
  .confirm-box .ctitle{ font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:.5px; margin-bottom:2px; }
  .confirm-box .csub{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .confirm-item{
    display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03);
    border:1px solid var(--border-soft); border-radius:11px; padding:10px; margin-bottom:14px;
  }
  .confirm-item .thumb{ width:56px; height:44px; border-radius:8px; overflow:hidden; flex-shrink:0; background:#0d0f17; }
  .confirm-item .thumb img{ width:100%; height:100%; object-fit:contain; background:#0d0f17; }
  .confirm-item .meta .name{ font-size:13.5px; font-weight:800; }
  .confirm-item .meta .price{ font-size:15px; margin-top:2px; }
  .input-group{ margin-bottom:14px; }
  .input-group label{ display:block; font-size:11.5px; font-weight:700; color:var(--text-muted); margin-bottom:6px; letter-spacing:.2px; }
  .input-group input{
    width:100%; background:rgba(255,255,255,0.045); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; color:var(--text); font-size:13.5px; outline:none; font-family:'Manrope', sans-serif; transition:.15s;
  }
  .input-group input:focus{ border-color:rgba(155,107,255,.55); background:rgba(155,107,255,0.06); }
  .input-hint{ font-size:10.5px; color:var(--text-dim); margin-top:5px; }
  .input-hint.error{ color:var(--danger); }
  .confirm-actions{ display:flex; gap:8px; }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:none; font-size:13px; font-weight:800; cursor:pointer; transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-cancel{ background:rgba(255,255,255,0.05); color:var(--text-muted); border:1px solid var(--border); }
  .btn-cancel:hover{ background:rgba(255,255,255,0.09); color:var(--text); }
  .btn-confirm{ background:linear-gradient(180deg, #a97bff, #8455f0); color:#fff; box-shadow:0 4px 14px rgba(139,85,240,0.35); }
  .btn-confirm:hover{ filter:brightness(1.08); }
  .btn-confirm[disabled]{ opacity:.5; cursor:not-allowed; filter:none; }
  .spinner{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.35); border-top-color:#fff; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #toasts{ position:absolute; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:30; width:280px; }
  .toast{
    background:#151926; border:1px solid var(--border); border-left:3px solid var(--violet);
    border-radius:10px; padding:11px 13px; font-size:12.5px; font-weight:600; color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.4); animation:toast-in .22s ease; display:flex; gap:9px; align-items:flex-start;
  }
  .toast.success{ border-left-color:var(--cyan); }
  .toast.error{ border-left-color:var(--danger); }
  .toast b{ display:block; margin-bottom:2px; }
  .toast.success b{ color:var(--cyan); }
  .toast.error b{ color:#ff8fa3; }
  @keyframes toast-in{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:translateX(0); } }
  @media (max-width: 720px){
    nav.categories{ width:150px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
  }
</style>
</head>

    requiresInput:true, inputLabel:'Новый ник', inputPlaceholder:'Name_Surname',
    inputPattern:/^[A-Z][a-z]+_[A-Z][a-z]+$/, inputHint:'Формат Name_Surname' },
  { id:'srv_gender', category:'services', name:'Смена пола', desc:'50 Coins', price:50 },
  { id:'srv_unwarn', category:'services', name:'Снять варн', desc:'1 активный варн · 250 Coins', price:250 },
  { id:'srv_gpass', category:'services', name:'Очистить гетто-паспорт', desc:'300 Coins', price:300 },
  { id:'srv_phone', category:'services', name:'Смена номера телефона', desc:'5 цифр · 750 Coins', price:750,
    requiresInput:true, inputLabel:'Номер', inputPlaceholder:'12345',
    inputPattern:/^\d{5}$/, inputHint:'Ровно 5 цифр' },
  { id:'srv_vip_gold', category:'services', name:'VIP Gold', desc:'1400 Coins', price:1400 },
  { id:'srv_pack_start', category:'services', name:'Набор стартовый', desc:'100.000$ · 180 Coins', price:180 },
  { id:'srv_pack_biz', category:'services', name:'Набор бизнесмен', desc:'250.000$ · 400 Coins', price:400 },
  { id:'srv_pack_solid', category:'services', name:'Набор солидный', desc:'550.000$ · 800 Coins', price:800 },
  { id:'srv_pack_gold', category:'services', name:'Набор золотой', desc:'1.400.000$ · 1800 Coins', price:1800 },
  { id:'srv_pack_million', category:'services', name:'Набор миллионер', desc:'7.500.000$ · 8000 Coins', price:8000 },
];

let bridge;
if (typeof cef !== 'undefined') {
  bridge = cef;
} else {
  console.warn('[IZZEENITY] cef API не найден — локальная заглушка.');
  const handlers = {};
  bridge = {
    on(event, cb){ handlers[event] = cb; },
    emit(event, ...args){
      console.log('[MOCK cef.emit]', event, args);
      if (event === 'donate:buy') {
        setTimeout(() => handlers['donate:response'] && handlers['donate:response'](true, 'Демо: OK', args[0], 9999), 400);
      }
      if (event === 'donate:preview') {
        setTimeout(() => handlers['donate:response'] && toast('success','Примерка','Скин на 30 сек (в игре)'), 100);
      }
    }
  };
  window.addEventListener('load', () => {
    setTimeout(() => handlers['donate:init'] && handlers['donate:init'](12500, 'Player_Demo'), 80);
  });
}

const state = { balance:0, activeCategory:'skins', search:'', pendingItem:null };
const ICONS = {
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2A2 2 0 0 1 19.5 8L21 13"/><rect x="2.5" y="13" width="19" height="5" rx="1.5"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg>',
};
function fmt(n){ return Number(n||0).toLocaleString('ru-RU'); }

function renderCategories(){
  const nav = document.getElementById('categories');
  nav.innerHTML = CATEGORIES.map(cat => {
    const count = ITEMS.filter(i => i.category === cat.id).length;
    return `<div class="cat-btn ${cat.id===state.activeCategory?'active':''}" data-cat="${cat.id}">
      <span class="ic">${ICONS[cat.icon]}</span><span>${cat.label}</span><span class="cat-count">${count}</span></div>`;
  }).join('');
  nav.querySelectorAll('.cat-btn').forEach(el => {
    el.addEventListener('click', () => {
      state.activeCategory = el.dataset.cat; state.search = '';
      document.getElementById('search-input').value = '';
      renderCategories(); renderItems();
    });
  });
}

function renderItems(){
  const cat = CATEGORIES.find(c => c.id === state.activeCategory);
  document.getElementById('content-title').textContent = cat.label;
  document.getElementById('content-sub').textContent = cat.sub;
  const q = state.search.trim().toLowerCase();
  const list = ITEMS.filter(i => i.category === state.activeCategory &&
    (!q || i.name.toLowerCase().includes(q) || (i.desc||'').toLowerCase().includes(q)));
  const container = document.getElementById('items-container');
  if (!list.length){
    const emptyMsg = state.activeCategory === 'acc'
      ? `<div class="empty"><b>Аксессуары скоро</b><span>Товары появятся после добавления в донат</span></div>`
      : `<div class="empty"><b>Ничего не найдено</b><span>Попробуйте другой запрос</span></div>`;
    container.innerHTML = emptyMsg;
    return;
  }
  if (state.activeCategory === 'services'){
    container.innerHTML = `<div class="list">${list.map(rowHTML).join('')}</div>`;
  } else {
    container.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  }
  container.querySelectorAll('[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => openConfirm(btn.dataset.buy));
  });
  container.querySelectorAll('[data-try]').forEach(btn => {
    btn.addEventListener('click', () => {
      bridge.emit('donate:preview', btn.dataset.try);
      toast('success','Примерка','Запрос отправлен (30 сек, без бонусов)');
    });
  });
}

function cardHTML(item){
  const thumb = item.image
    ? `<img src="${item.image}" alt="${item.name}" onerror="this.style.display='none';this.parentElement.querySelector('.fallback').style.display='flex';"><div class="fallback" style="display:none;">${item.name}</div>`
    : `<div class="fallback" style="display:flex;">${item.name}</div>`;
  const tryBtn = item.category==='skins'
    ? `<button class="try-btn" data-try="${item.id}">Примерить</button>` : '';
  return `<div class="card"><div class="thumb">${item.badge?`<div class="badge">${item.badge}</div>`:''}${thumb}</div>
    <div class="info"><div class="name">${item.name}</div><div class="desc">${item.desc||''}</div>
    <div class="row"><div class="price"><div class="coin"></div>${fmt(item.price)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${tryBtn}<button class="buy-btn" data-buy="${item.id}">Купить</button></div>
    </div></div></div>`;
}

function rowHTML(item){
  return `<div class="row-item"><div class="ic-wrap">${ICONS.star}</div>
    <div class="body-txt"><div class="name">${item.name}</div><div class="desc">${item.desc||''}</div></div>
    <div class="row-right"><div class="price"><div class="coin"></div>${fmt(item.price)}</div>
    <button class="buy-btn" data-buy="${item.id}">Купить</button></div></div>`;
}

function openConfirm(itemId){
  const item = ITEMS.find(i => i.id === itemId);
  if (!item) return;
  state.pendingItem = item;
  document.getElementById('c-name').textContent = item.name;
  if (item.id === 'srv_exchange') {
    document.getElementById('c-price').textContent = '1 = 700$';
  } else {
    document.getElementById('c-price').textContent = fmt(item.price);
  }
  const thumbWrap = document.getElementById('c-thumb-wrap');
  const thumbImg = document.getElementById('c-thumb');
  if (item.image){ thumbWrap.style.display='block'; thumbImg.src=item.image; }
  else { thumbWrap.style.display='none'; }
  const group = document.getElementById('c-input-group');
  const input = document.getElementById('c-input');
  const hint = document.getElementById('c-input-hint');
  const confirmBtn = document.getElementById('c-confirm');
  if (item.requiresInput){
    group.style.display='block';
    document.getElementById('c-input-label').textContent = item.inputLabel || 'Значение';
    input.placeholder = item.inputPlaceholder || ''; input.value='';
    hint.textContent = item.inputHint || ''; hint.classList.remove('error');
    confirmBtn.disabled = true; setTimeout(()=>input.focus(),150);
  } else { group.style.display='none'; confirmBtn.disabled=false; }
  confirmBtn.innerHTML='Купить';
  document.getElementById('confirm-layer').classList.add('visible');
}
function closeConfirm(){ document.getElementById('confirm-layer').classList.remove('visible'); state.pendingItem=null; }

function validateInput(){
  const item = state.pendingItem;
  if (!item || !item.requiresInput) return true;
  const input = document.getElementById('c-input');
  const hint = document.getElementById('c-input-hint');
  const confirmBtn = document.getElementById('c-confirm');
  const val = input.value.trim();
  let valid = val.length > 0;
  if (valid && item.inputPattern) valid = item.inputPattern.test(val);
  if (valid && item.id === 'srv_exchange') valid = parseInt(val,10) >= 1;
  confirmBtn.disabled = !valid;
  hint.classList.toggle('error', val.length>0 && !valid);
  if (val.length>0 && !valid) hint.textContent = 'Неверный формат — '+(item.inputHint||'');
  else if (item.id === 'srv_exchange' && valid) {
    const n = parseInt(val,10);
    hint.textContent = n + ' Coin = ' + fmt(n*700) + '$';
    document.getElementById('c-price').textContent = fmt(n*700)+'$';
  } else hint.textContent = item.inputHint||'';
  return valid;
}

function submitPurchase(){
  const item = state.pendingItem;
  if (!item) return;
  if (item.requiresInput && !validateInput()) return;
  const extraValue = item.requiresInput ? document.getElementById('c-input').value.trim() : '';
  const confirmBtn = document.getElementById('c-confirm');
  confirmBtn.disabled = true;
  confirmBtn.innerHTML = '<span class="spinner"></span>';
  bridge.emit('donate:buy', item.id, extraValue);
}

document.getElementById('c-cancel').addEventListener('click', closeConfirm);
document.getElementById('c-confirm').addEventListener('click', submitPurchase);
document.getElementById('c-input').addEventListener('input', validateInput);
document.getElementById('confirm-layer').addEventListener('click', e => { if (e.target.id==='confirm-layer') closeConfirm(); });

function toast(type, title, text){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = `<div><b>${title}</b>${text||''}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateX(16px)'; setTimeout(()=>el.remove(),250); }, 3200);
}

bridge.on('donate:init', (coins, nickname) => {
  state.balance = coins||0;
  document.getElementById('balance-value').textContent = fmt(state.balance);
  document.getElementById('backdrop').classList.add('visible');
});
bridge.on('donate:response', (success, message, itemId, newBalance) => {
  const confirmBtn = document.getElementById('c-confirm');
  if (success){
    if (typeof newBalance === 'number'){ state.balance=newBalance; document.getElementById('balance-value').textContent=fmt(state.balance); }
    toast('success','Покупка успешна', message?(' — '+message):'');
    closeConfirm();
  } else {
    toast('error','Не удалось купить', message?(' — '+message):'');
    confirmBtn.disabled=false; confirmBtn.innerHTML='Купить';
  }
});
bridge.on('donate:balance', (coins) => {
  state.balance = coins||0;
  document.getElementById('balance-value').textContent = fmt(state.balance);
});

function closeShop(){
  document.getElementById('backdrop').classList.remove('visible');
  closeConfirm();
  bridge.emit('donate:close');
}
document.getElementById('close-btn').addEventListener('click', closeShop);
document.getElementById('search-input').addEventListener('input', (e)=>{ state.search=e.target.value; renderItems(); });
document.addEventListener('keydown', (e)=>{
  if (e.key==='Escape'){
    if (document.getElementById('confirm-layer').classList.contains('visible')) closeConfirm();
    else closeShop();
  }
});
renderCategories(); renderItems();
</script>
</body>
</html>
